{
    // The registry accepts // and # comments and trailing commas, so a manifest
    // an administrator has edited under /etc survives a stray comma rather than
    // disappearing. Packaged manifests should still be plain JSON.

    // Unique across the whole host. This is the path segment the extension is
    // given (/nodes/{node}/proxmod/example-hello), so it is not a display name.
    "id": "example-hello",

    "version": "0.1.0",

    // Load order among extensions. Ties break by manifest filename. Only worth
    // setting if something else declares `requires` on this one.
    "order": 50,

    "backend": {
        // Reached by require() inside a daemon running under -T, so the
        // registry untaints it against a strict package-name pattern before it
        // gets anywhere near the compiler [PVE-F-042].
        "module": "ProxmodExample::Hello",

        // Both daemons, which is the default and almost always right: every
        // request reaches pveproxy first and it must find the method in its own
        // tree before it can decide to proxy it, so an API tree registered only
        // in pvedaemon answers 501 Not Implemented for everything [PVE-F-052].
        "daemons": ["pvedaemon", "pveproxy"]
    },

    "frontend": {
        // Plain filenames under /usr/share/proxmod/www. No directories: this
        // name is interpolated into a URL that pveproxy serves without
        // authentication [PVE-F-023].
        "assets": ["proxmod-example-hello.js"]
    }
}
