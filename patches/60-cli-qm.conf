// Make `qm` load proxmod, so an extension's seam wraps apply to VM
// operations issued from a root shell as well as through the REST API.
//
// DISABLED, and read the two paragraphs below before you change that.
//
// WHY THIS EXISTS. proxmod reaches pvedaemon and pveproxy through a systemd
// ExecStart drop-in, which a command somebody types never sees. `qm` is an
// eight-line stub that loads PVE::CLI::qm and dispatches in its own process,
// to the same PVE::API2 classes the daemons use — so the seam is there, and only
// the loading is missing. Without this, a quota or any other wrap is enforced
// through the API and silently not from the shell.
//
// WHAT IT COSTS. `dpkg -V qemu-server` stops being silent, which is the headline
// claim of ADR 0001 and is given up for this one file. Every qemu-server upgrade
// rewrites the module and drops the patch, so proxmod-reapply has to put it back
// — that is what the state database and the checksums are for, but it is still a
// promise proxmod cannot make for you.
//
// AND THE BLAST RADIUS. Once this is on, every `qm` invocation loads
// proxmod and every extension that named `qm`. If proxmod is broken,
// `qm` is broken. Three things carry that and it is worth knowing them
// before you need them: Proxmod.pm's INIT block is wrapped in an eval and never
// dies, each extension loads inside its own eval, and touching
// /etc/proxmod/disabled turns the lot off without removing a package.
//
// See docs/patching.md and ADR 0013.
{
    "id": "cli-qm",
    "description": "Load proxmod into qm, so seam wraps apply to the command line too.",

    "enabled": 0,

    "target": "/usr/share/perl5/PVE/CLI/qm.pm",

    // The package line: unique by construction, present in every version this
    // file has ever had, and the earliest point in the file. Placement does not
    // affect correctness — Proxmod.pm does its work in an INIT block, which runs
    // after the whole program is compiled — so the most stable anchor wins.
    "anchor": "package PVE::CLI::qm;",

    "position": "after",

    // `use`, not `require`: it has to happen at compile time so that
    // Proxmod.pm's INIT block is registered before the program starts running.
    // /usr/share/perl5 is in the default \@INC, which is why this resolves even
    // under taint.
    "text": "use Proxmod;",

    "comment": "perl"
}
