// An example patch spec. It is DISABLED, and it is meant to stay that way.
//
// It shows the shape of a spec against a real Proxmox file, and it is
// deliberately an example of something you should not do: proxmod already puts
// a <script> tag into this page at runtime, in memory, without the file on disk
// ever changing. Doing it by patching instead gives up every upgrade guarantee
// proxmod has, in exchange for nothing.
//
// Enable it only to see the machinery work on a throwaway host. See
// docs/patching.md for when a patch is genuinely the only option, and for what
// you take on when you enable one.
{
    "id": "example-index-banner",
    "description": "Example only (disabled): add a comment to the web interface's page template.",

    // Absent or 0 means nothing happens. Every spec proxmod ships is 0, and
    // installing proxmod patches no file on the host.
    "enabled": 0,

    // Must sit under one of Proxmod::Patch's allowed roots. /etc/pve is
    // refused outright: it is the cluster filesystem, not program code.
    "target": "/usr/share/pve-manager/index.html.tpl",

    // A literal string that must appear EXACTLY ONCE in the target. Not a
    // regex — a regex is how a patch silently matches the wrong line three
    // point releases later. If it appears twice, or not at all, proxmod
    // refuses to patch and says so; "not at all" nearly always means an
    // upgrade rewrote the file and this spec needs revisiting.
    "anchor": "    <script type=\"text/javascript\" src=\"/pve2/js/pvemanagerlib.js?ver=[% version %]\"></script>",

    // after | before | replace
    "position": "after",

    // Inserted verbatim, wrapped in proxmod:begin/end markers so it can be
    // found again, applied only once, and removed surgically even if the rest
    // of the file has changed underneath it.
    "text": "    <!-- proxmod example patch: this file is normally left alone -->",

    // Optional. Inferred from the target's extension when omitted; set it when
    // the extension does not say what a comment looks like.
    "comment": "html"
}
