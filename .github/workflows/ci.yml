name: ci

# Everything here runs on a plain Debian container with no Proxmox on it.
# That is a deliberate constraint on the test suite rather than a limitation of
# CI: t/lib holds stubs for the PVE modules, so the unit tests exercise the
# real code against a stand-in for the parts of Proxmox they touch. The claims
# that can only be made about a live hypervisor are made by the QEMU suite,
# which needs KVM and a 5GB image and runs in e2e.yml on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Two pushes to a branch in quick succession currently race:
# both jobs build a .deb, both upload an artifact called `debs`, and which one
# survives is a matter of timing — so a green tick can belong to a commit that
# is no longer at the head. Superseding rather than queueing, because the only
# question CI answers is about the newest commit.
#
# main is exempt from cancellation: its runs are the record of what was true at
# each commit that landed, and a cancelled run there reads as a failure nobody
# can reproduce.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            perl libtest-simple-perl libjson-perl libhttp-message-perl make
          useradd -m ci
          chown -R ci:ci .

      # Every module is compiled under -T as well as plainly. Taint mode is not
      # optional here: /usr/bin/pveproxy is `#!/usr/bin/perl -T` [PVE-F-002],
      # so code that only compiles without it would fail on a real host and
      # nowhere else.
      #
      # PROXMOD_TEST_PREFIX (what t/07-10 use to redirect exec/proxmod-* into a
      # disposable tree) is honoured only when the effective UID is not 0, by
      # design — see exec/proxmod-exec. Run as a real non-root user so it
      # activates instead of silently falling through to production paths.
      - name: prove -r t/
        run: su ci -c 'umask 022 && prove -r t/'

  lint:
    name: lint
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install linters
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            perl shellcheck nodejs make

      # shellcheck matters more here than in most projects: proxmod's shell
      # runs as root, out of systemd and dpkg triggers, at the moment the
      # package is least able to report a problem.
      #
      # LINT_STRICT because lint-shell and half of lint-js print "skipping" and
      # exit 0 when their tool is missing. That is right for a developer with
      # only perl installed and wrong for a gate: without it, dropping
      # `shellcheck` from the apt line above would turn this job green and
      # nobody would notice for months.
      - name: make lint
        run: LINT_STRICT=1 make lint

  package:
    name: build the package
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian perl fakeroot
          useradd -m ci
          chown -R ci:ci .
          chown ci:ci ..

      # Rules-Requires-Root: no in debian/control means this package is built
      # by a non-root user, with fakeroot faking root only where dpkg needs it.
      # Building as real root here would never exercise that.
      - name: dpkg-buildpackage
        run: su ci -c 'dpkg-buildpackage -us -uc -b'

      - name: build the example extension
        run: su ci -c 'cd examples/proxmod-example-hello && dpkg-buildpackage -us -uc -b'

      # A gate. This used to end in `|| true`, on the argument that a failing
      # gate nobody can satisfy gets disabled rather than fixed — true, and the
      # answer to it is to satisfy the gate, which both packages now do. When a
      # tag turns up that genuinely does not apply here, override it in
      # debian/proxmod.lintian-overrides with a comment saying why, so the next
      # reader argues with one decision rather than with a blanket exemption.
      #
      # The example is linted too: it is the package every extension author
      # copies, so a finding there propagates.
      - name: lintian
        run: |
          lintian --fail-on error,warning ../proxmod_*_all.deb
          lintian --fail-on error,warning examples/proxmod-example-hello_*_all.deb

      # The claim in the documentation is that an extension package needs no
      # maintainer scripts at all. If that ever stops being true, the contract
      # every extension author codes against has changed and the docs are
      # wrong — so it is checked here rather than only in the QEMU suite.
      - name: the example ships no maintainer scripts
        run: |
          set -e
          deb=$(ls examples/proxmod-example-hello_*_all.deb | head -1)
          dpkg -e "$deb" /tmp/ctrl
          found=$(find /tmp/ctrl -maxdepth 1 -type f \
                    \( -name postinst -o -name preinst -o -name prerm -o -name postrm \) \
                    -printf '%f ')
          if [ -n "$found" ]; then
            echo "the example extension grew maintainer scripts: $found" >&2
            exit 1
          fi
          echo "ok: no maintainer scripts"

      # docs/testing.md §2 and docs/packaging.md §9 both end in a checklist
      # that can only be run against a built package, which is why they have
      # been prose up to now. They are here instead. Everything in those lists
      # that can be checked from the source tree already is — the /etc/pve
      # prohibition is t/09-reapply.t, the maintainer-script rule is the step
      # above — so what is left is what needs the .deb in hand.
      - name: the built packages match what the docs promise
        run: |
          set -eu
          deb=$(ls ../proxmod_*_all.deb | head -1)
          ex=$(ls examples/proxmod-example-hello_*_all.deb | head -1)
          fail=0
          say() { echo "FAIL: $*" >&2; fail=1; }

          # docs/third_party/ is eight upstream repositories, vendored as
          # submodules so that a [PVE-F-nnn] fact can be re-derived from source.
          # debian/source/options keeps them out of the source package and
          # nothing installs them — but the day something does, it is tens of
          # megabytes of somebody else's code shipped to every PVE host under
          # proxmod's name and licence.
          if dpkg-deb -c "$deb" | grep -q third_party; then
            say "third_party is inside the package"
          fi

          # The runtime dependency floor. Each of these is imported by a module
          # that runs inside pvedaemon; a missing one is a daemon that dies on
          # `use`, which is the failure the prime directive exists to prevent.
          # libhttp-message-perl in particular is satisfied transitively today,
          # which is exactly why dropping it would go unnoticed until it didn't.
          depends=$(dpkg-deb -f "$deb" Depends)
          for d in pve-manager libpve-http-server-perl libhttp-message-perl systemd; do
            case ",$depends," in *"$d"*) ;; *) say "framework Depends lost $d" ;; esac
          done

          # The extension contract, as docs/packaging.md §9 states it: three
          # installed paths, none owned by Proxmox. This is the shape every
          # extension author copies, and the second half is the whole safety
          # argument — an extension that writes into /usr/share/pve-manager is
          # doing the thing proxmod was written to stop people doing.
          paths=$(dpkg-deb -c "$ex" | awk '$1 !~ /^d/ {print $6}' | grep -v '^./usr/share/doc/' || true)
          n=$(printf '%s\n' "$paths" | grep -c . || true)
          [ "$n" -eq 3 ] || { say "the example installs $n paths, not three"; echo "$paths" >&2; }
          case "$paths" in
            *"/usr/share/pve-manager"*|*"/usr/share/perl5/PVE/"*|*"/etc/pve"*|*"proxmox-widget-toolkit"*)
              say "the example installs into a Proxmox-owned path"; echo "$paths" >&2 ;;
          esac

          # And it depends on proxmod with a floor, on nothing from pve-manager.
          # An extension that pins a pve-manager version inherits proxmod's
          # compatibility problem without inheriting any of its handling of it.
          exdep=$(dpkg-deb -f "$ex" Depends)
          case "$exdep" in *"proxmod (>= "*) ;; *) say "the example does not depend on a proxmod version: $exdep" ;; esac
          case "$exdep" in *pve-manager*) say "the example depends on pve-manager: $exdep" ;; esac

          if [ "$fail" -eq 0 ]; then
            echo "ok: both packages match the documented shape"
          fi
          exit "$fail"

      # actions/upload-artifact rejects glob patterns containing a '..'
      # segment outright, and dpkg-buildpackage always puts its .deb one
      # directory above the source tree it built from — so the artifact has
      # to be collected into the workspace before it can be uploaded.
      - name: collect artifacts
        run: |
          mkdir -p dist
          cp ../proxmod_*_all.deb examples/proxmod-example-hello_*_all.deb dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debs
          path: dist/*_all.deb
          if-no-files-found: error
