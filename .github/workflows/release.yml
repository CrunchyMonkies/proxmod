name: release

# Publishes the .deb packages built by ci.yml's "package" job to a GitHub
# Release whenever a version tag is pushed. Kept separate from ci.yml rather
# than gated behind it, because a release should never depend on a workflow
# whose trigger (push to main) may or may not have run for the exact commit
# being tagged.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts perl fakeroot
          useradd -m ci
          chown -R ci:ci .
          chown ci:ci ..

      # A tag is a promise that its version and the package's agree. Catch the
      # case where someone tags before bumping debian/changelog (or vice
      # versa) before it ships a release under the wrong name.
      - name: tag matches debian/changelog version
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(dpkg-parsechangelog -S Version)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag v$tag_version does not match debian/changelog version $pkg_version" >&2
            exit 1
          fi

      # Rules-Requires-Root: no in debian/control means this package is built
      # by a non-root user, with fakeroot faking root only where dpkg needs it.
      - name: dpkg-buildpackage
        run: su ci -c 'dpkg-buildpackage -us -uc -b'

      - name: build the example extension
        run: su ci -c 'cd examples/proxmod-example-hello && dpkg-buildpackage -us -uc -b'

      # actions/upload-artifact and softprops/action-gh-release both reject
      # glob patterns containing a '..' segment, and dpkg-buildpackage always
      # puts its .deb one directory above the source tree it built from — so
      # the artifacts have to be collected into the workspace first.
      - name: collect artifacts
        run: |
          mkdir -p dist
          cp ../proxmod_*_all.deb examples/proxmod-example-hello_*_all.deb dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*_all.deb
          generate_release_notes: true
