# proxmod loader for pvedaemon.
#
# Installed to /etc/systemd/system/pvedaemon.service.d/ by proxmod's postinst,
# and removed by its prerm. It is not a dpkg conffile: prerm has to remove this
# file BEFORE dpkg deletes /usr/lib/proxmod/proxmod-exec, or a restart in the
# window between the two would leave pvedaemon pointing at an ExecStart that no
# longer exists.
#
# pvedaemon is the daemon that matters most here. It runs as root and executes
# every API method marked `protected`, so this is where a backend extension's
# privileged work actually happens — and equally why proxmod-exec refuses to
# inject when anything it loads is writable by a non-root user.
#
# WHY A WRAPPER RATHER THAN A HARDCODED COMMAND. proxmod-exec reads pvedaemon's
# real ExecStart out of the base unit at start time and adds only -MProxmod, so
# it survives Proxmox changing the invocation. It is fail-safe: on any problem
# it starts pvedaemon exactly as shipped. See exec/proxmod-exec.
#
# WHY ExecReload IS OVERRIDDEN. PVE's own reload is `pvedaemon restart`, an
# in-process exec() of the original argv — which does not contain -MProxmod. A
# plain `systemctl reload pvedaemon` would therefore unload proxmod silently,
# leaving a daemon that looks healthy and serves none of the extensions.
# Rewriting the reload as a real restart re-runs ExecStart, and so re-injects.
#
# This matters more than it sounds: pve-manager's own postinst runs
# `deb-systemd-invoke reload-or-try-restart pvedaemon.service` on every upgrade
# [PVE-F-005], which prefers reload. Without this override, proxmod would come
# undone on exactly the event it exists to survive. With it, Proxmox's upgrade
# path re-injects proxmod for us.
#
# --no-block avoids deadlocking: a unit cannot wait for its own restart job from
# inside its own ExecReload. The leading '-' keeps a failed reload from marking
# the unit failed.

[Service]
ExecStart=
ExecStart=/usr/lib/proxmod/proxmod-exec pvedaemon
ExecReload=
ExecReload=-/bin/systemctl --no-block restart pvedaemon.service
