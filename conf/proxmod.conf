# proxmod global configuration.
#
# This file is a dpkg conffile: your edits survive upgrades, and dpkg will ask
# before replacing it. Extensions are configured separately, by drop-in
# manifests under /etc/proxmod/extensions.d/ — see proxmod(8) and
# /usr/share/doc/proxmod/extension-manifest.md.
#
# Format is `key = value`, one per line; # begins a comment.

# Verbose logging to the journal for pvedaemon and pveproxy. Off by default
# because it logs a line per extension per daemon start.
#
# proxmod also honours the PROXMOD_DEBUG environment variable, but only when a
# daemon is started by hand: systemd starts pvedaemon with a cleared
# environment, so on a real host this file is the switch that works.
#
#   journalctl -u pveproxy -u pvedaemon -f | grep proxmod
#
debug = 0

# To disable proxmod entirely without uninstalling it:
#
#   touch /etc/proxmod/disabled && systemctl restart pvedaemon pveproxy
#
# The daemons then start exactly as Proxmox ships them. That file, not a setting
# here, is the kill switch — it is checked by the ExecStart wrapper before any
# proxmod code is loaded at all, so it still works when proxmod itself is broken.
